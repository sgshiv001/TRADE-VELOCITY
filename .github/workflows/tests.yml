name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: frontend
      - name: Type-check and build production UI
        run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
      - name: Confirm frontend is available to the app
        run: python -c "from pathlib import Path; assert Path('frontend/dist/index.html').is_file()"
      - name: Install Python app and test dependencies
        run: python -m pip install -e ".[app,test]"
      - name: Install Windows desktop runtime for lifecycle tests
        if: runner.os == 'Windows'
        run: python -m pip install "pywebview>=6,<7"
      - name: Confirm Windows desktop tests are enabled
        if: runner.os == 'Windows'
        run: python -c "import webview"
      - name: Run the complete Python suite
        run: python -m pytest -q -ra
      - name: Replay example matching scenario
        run: python -m stock_engine.cli run scenarios/demo.json
