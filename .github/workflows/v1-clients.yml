name: V1 client builds

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:shared
      - run: pnpm build:web
      - run: pnpm build:desktop
      - run: pnpm check:mobile
      - run: pnpm --filter @tradevelocity/mobile export:android
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[app,test]"
      - run: pnpm --filter tradevelocity-app exec playwright install --with-deps chromium
      - name: Exercise the Next.js export served by FastAPI
        env:
          TRADEVELOCITY_WEB_DIR: ${{ github.workspace }}/apps/web/out
        run: pnpm --filter tradevelocity-app exec playwright test --grep "order lifecycle|themes, dark dropdowns"
