name: Windows presentation release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e ".[app]" pyinstaller
      - run: pnpm build:web
      - run: pnpm build:desktop
      - run: python scripts/build_presentation_engine.py
      - run: pnpm --filter @tradevelocity/desktop package:windows:presentation
      - name: Verify and attach the single x64 executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw apps/desktop/package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'Release tag must match the desktop version.' }
          $output = 'apps/desktop/build/presentation'
          $artifact = @(Get-ChildItem -LiteralPath $output -File -Filter *.exe)
          if ($artifact.Count -ne 1 -or $artifact[0].Name -ne "TradeVelocity-$version-Windows-x64.exe") { throw 'Expected one presentation executable.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact[0].FullName).Hash.ToLowerInvariant()
          $checksums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          "$hash  $($artifact[0].Name)" | Set-Content -LiteralPath $checksums -Encoding ascii
          if ((gh release view $env:GITHUB_REF_NAME --json isDraft --jq '.isDraft') -ne 'true') { throw 'Prepare a draft release first.' }
          gh release upload $env:GITHUB_REF_NAME $artifact[0].FullName $checksums --clobber
