services:
  - type: web
    name: gettradevelocity
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: TRADEVELOCITY_MODE
        value: accounts
      - key: TRADEVELOCITY_DATA_DIR
        value: /data/sessions
      - key: DATABASE_URL
        sync: false
