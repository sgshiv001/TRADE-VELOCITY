[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-matching-engine"
version = "0.1.0"
description = "A price-time-priority stock order matching engine built with explicit data structures"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dashboard = ["streamlit>=1.64,<2", "pandas>=2"]
app = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "yfinance>=0.2.66,<2"]
test = ["pytest>=8", "httpx2>=2,<3"]

[project.scripts]
stock-engine = "stock_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_engine = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
